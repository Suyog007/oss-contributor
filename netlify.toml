[build]
  # Generates the Prisma client (the install step is skipped when node_modules is
  # cached), applies pending migrations, builds the dashboard, then bundles the
  # worker functions that run the pipeline on a schedule.
  command = "pnpm prisma generate && pnpm prisma migrate deploy && pnpm build && pnpm bundle:functions"

[build.environment]
  NODE_VERSION = "22"
  # Netlify has no Docker, so command execution is off. Verification then relies
  # on the validator, duplicate and maintainer checks instead of a sandbox repro.
  SANDBOX_MODE = "none"

[functions]
  directory = "netlify/functions"
